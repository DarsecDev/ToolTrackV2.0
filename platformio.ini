; ============================================================
;  ToolTrack v2 — PlatformIO
;  Dos entornos: placa maestra (ESP32-S3 DevKitC-1 N16R8)
;                y nodo de visión (XIAO ESP32-S3 Sense)
; ============================================================

[platformio]
default_envs = main
src_dir = src
data_dir = data

[env]
platform = espressif32@7.0.1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
lib_ldf_mode = deep+
build_flags =
    -DCORE_DEBUG_LEVEL=3

; ------------------------------------------------------------
;  PLACA MAESTRA
;  ESP32-S3-DevKitC-1 N16R8 (16 MB flash QIO, 8 MB PSRAM OPI)
; ------------------------------------------------------------
[env:main]
board = esp32-s3-devkitc-1
board_build.flash_size = 16MB
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions/main_16mb.csv
board_build.filesystem = littlefs
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
build_src_filter = +<main/>
build_flags =
    ${env.build_flags}
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DFIRMWARE_ROLE_MAIN=1
lib_deps =
    mathieucarbou/ESPAsyncWebServer@^3.6.0
    mathieucarbou/AsyncTCP@^3.3.2
    bblanchon/ArduinoJson@^7.2.1
    miguelbalboa/MFRC522@^1.4.11
    tzapu/WiFiManager@^2.0.17

; ------------------------------------------------------------
;  NODO DE VISIÓN
;  Seeed XIAO ESP32-S3 Sense (8 MB flash, 8 MB PSRAM)
; ------------------------------------------------------------
[env:camera]
board = seeed_xiao_esp32s3
board_build.partitions = partitions/camera_8mb.csv
board_build.filesystem = littlefs
build_src_filter = +<camera/>
build_flags =
    ${env.build_flags}
    -DFIRMWARE_ROLE_CAMERA=1
lib_deps =
    mathieucarbou/ESPAsyncWebServer@^3.6.0
    mathieucarbou/AsyncTCP@^3.3.2
    bblanchon/ArduinoJson@^7.2.1
    tzapu/WiFiManager@^2.0.17
